name: Build, test and publish ARM64 image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ghcr-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test control service
        run: python3 -m unittest discover -s tests -v
      - name: Check browser script
        run: node --check web/app.js
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: |
            ghcr.io/admrlos/workload-jukebox:${{ github.sha }}
            ghcr.io/admrlos/workload-jukebox:latest
          labels: |
            org.opencontainers.image.source=https://github.com/admrlos/workload-jukebox
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Admiral Office Jukebox
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test actual receivers and output fallback
        run: docker run --rm --entrypoint /usr/bin/python3 ghcr.io/admrlos/workload-jukebox:${{ github.sha }} /app/tests/container_smoke.py
      - name: Publish tested image
        run: |
          docker push ghcr.io/admrlos/workload-jukebox:${{ github.sha }}
          docker push ghcr.io/admrlos/workload-jukebox:latest
